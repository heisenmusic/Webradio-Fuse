# Fuse Radio Enterprise — API em Kubernetes (base para EKS/GKE)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuse-api
  namespace: fuse-radio
spec:
  replicas: 3
  selector:
    matchLabels: { app: fuse-api }
  template:
    metadata:
      labels: { app: fuse-api }
    spec:
      containers:
        - name: api
          image: ghcr.io/heisenmusic/fuse-api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef: { name: fuse-api-env }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /v1/health, port: 4000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /v1/health, port: 4000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: fuse-api
  namespace: fuse-radio
spec:
  selector: { app: fuse-api }
  ports:
    - port: 80
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fuse-api
  namespace: fuse-radio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fuse-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
