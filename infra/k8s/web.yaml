# Fuse Radio Enterprise — Web (Player + Dashboard) em Kubernetes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuse-web
  namespace: fuse-radio
spec:
  replicas: 2
  selector:
    matchLabels: { app: fuse-web }
  template:
    metadata:
      labels: { app: fuse-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/heisenmusic/fuse-web:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fuse-web
  namespace: fuse-radio
spec:
  selector: { app: fuse-web }
  ports:
    - port: 80
      targetPort: 3000
---
# Ingress atrás do Cloudflare (TLS terminado no edge + origin cert)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuse
  namespace: fuse-radio
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: app.fuseradio.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: fuse-web, port: { number: 80 } }
    - host: api.fuseradio.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: fuse-api, port: { number: 80 } }
