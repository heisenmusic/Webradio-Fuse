packages:
  - "apps/*"
  - "packages/*"

# Subdependências fixadas em versões estáveis (≥24h) para satisfazer a
# política minimumReleaseAge do pnpm 11 sem afrouxá-la.
overrides:
  "es-module-lexer@2": 2.3.0
  "nanoid@3": 3.3.15

# pnpm 11 bloqueia scripts de instalação não aprovados. Estes são os
# únicos com build script legítimo no projeto:
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp

# O binário do Electron (~100MB) só é necessário para o app desktop
# (apps/desktop). Para usá-lo: pnpm rebuild electron
ignoredBuiltDependencies:
  - electron
