name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build @fuse/shared
        run: pnpm --filter @fuse/shared build

      - name: Testes @fuse/shared
        run: pnpm --filter @fuse/shared test

      - name: Gerar cliente Prisma
        run: pnpm --filter @fuse/api prisma:generate

      - name: Build @fuse/api
        run: pnpm --filter @fuse/api build

      - name: Build @fuse/web
        run: pnpm --filter @fuse/web build
